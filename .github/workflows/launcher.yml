name: Launcher

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
    tags: ["launcher-v*"]
  pull_request:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q launcher/tests

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      # Inno Setup 6 ships on GitHub's Windows images.
      - run: python launcher/build_exe.py
      - name: Smoke test the frozen launcher
        shell: bash
        run: launcher/dist/AnimaniacsLauncher.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: AnimaniacsLauncher
          path: |
            launcher/dist/AnimaniacsLauncher.exe
            launcher/dist/AnimaniacsLauncherSetup-*.exe
      # A launcher-v<version> tag publishes the installer as a release, which
      # installed launchers offer as an update.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Launcher ${{ github.ref_name }}
          files: launcher/dist/AnimaniacsLauncherSetup-*.exe
