# GitLab CI for the launcher (launcher/) and for releases.
#
#   launcher-v<version> tag  builds the installer and publishes it as a
#                            GitLab release; installed launchers offer it
#                            as an update
#   v<version> tag           publishes a game release; launchers on the
#                            Releases channel build that tag on their next
#                            update check (v1.1.0-rc1: a pre-release, which
#                            they skip unless asked)

stages: [test, build, release]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/launcher"

.launcher-changes: &launcher-changes
  - if: $CI_COMMIT_TAG =~ /^launcher-v/
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes: ["launcher/**/*", ".gitlab-ci.yml"]
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes: ["launcher/**/*", ".gitlab-ci.yml"]

launcher-test:
  stage: test
  image: python:3.12
  rules: *launcher-changes
  script:
    - git config --global user.name ci && git config --global user.email ci@example.org
    - python -m pip install pytest
    - python -m pytest -q launcher/tests

launcher-installer:
  stage: build
  # GitLab's hosted Windows runners
  tags: [saas-windows-medium-amd64]
  rules: *launcher-changes
  needs: [launcher-test]
  script:
    - choco install -y --no-progress python312 innosetup
    - $env:Path = "C:\Python312;C:\Python312\Scripts;C:\Program Files (x86)\Inno Setup 6;" + $env:Path
    - python -m pip install pyinstaller
    - python launcher/build_exe.py
    - '& .\launcher\dist\AnimaniacsLauncher.exe --version | Out-Host'
    - if ($LASTEXITCODE -ne 0) { exit 1 }
  artifacts:
    paths:
      - launcher/dist/AnimaniacsLauncher.exe
      - launcher/dist/AnimaniacsLauncherSetup-*.exe
    expire_in: 30 days

launcher-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^launcher-v/
  needs: [launcher-installer]
  script:
    - apk add --no-cache curl
    - VERSION="${CI_COMMIT_TAG#launcher-v}"
    - FILE="AnimaniacsLauncherSetup-${VERSION}.exe"
    - 'curl --fail -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "launcher/dist/${FILE}" "${PACKAGE_URL}/${VERSION}/${FILE}"'
    - >
      release-cli create --name "Launcher ${VERSION}" --tag-name "$CI_COMMIT_TAG"
      --description "Launcher ${VERSION}. Install it, or let an installed launcher update itself."
      --assets-link "{\"name\":\"${FILE}\",\"url\":\"${PACKAGE_URL}/${VERSION}/${FILE}\",\"link_type\":\"package\"}"

game-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    name: "Animaniacs Recompiled $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: >
      Build it with the launcher (Updates tab), or from source as in the README.
      No game files are included: you need your own copy of the game.
